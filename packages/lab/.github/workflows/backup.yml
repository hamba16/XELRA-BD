name: nightly-backup
on:
  schedule:
    - cron: '17 21 * * *'        # 00:17 East Africa Time, off the hour on purpose (GitHub drops top-of-hour jobs under load)
  workflow_dispatch: {}
concurrency: { group: backup, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 age
      - name: Dump, compress, encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}   # read-only role, session pooler URL
          AGE_RECIPIENTS: ${{ secrets.BACKUP_AGE_PUBLIC_KEYS }}  # public keys only: Director + VAIS escrow. No private key lives in CI.
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --schema='org' --schema='rbac' --schema='hr' \
            --schema='fin' --schema='approvals' --schema='audit' --schema='docs' --schema='payroll' --schema='public' \
            | age -R <(echo "$AGE_RECIPIENTS" | tr ',' '\n') > "xelra-$STAMP.dump.age"
          sha256sum "xelra-$STAMP.dump.age" > "xelra-$STAMP.dump.age.sha256"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          test "$(stat -c%s xelra-$STAMP.dump.age)" -gt 20000   # a near-empty dump is a failed dump
      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 cp "xelra-$STAMP.dump.age" "s3://xelra-backups/nightly/xelra-$STAMP.dump.age" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "xelra-$STAMP.dump.age.sha256" "s3://xelra-backups/nightly/xelra-$STAMP.dump.age.sha256" --endpoint-url "$R2_ENDPOINT"
