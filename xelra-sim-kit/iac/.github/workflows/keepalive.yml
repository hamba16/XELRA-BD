name: keepalive
on:
  schedule: [{ cron: "15 5 */2 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Touch the database so an idle week never pauses the project
        run: |
          curl -fsS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/record_heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" -d '{"p_kind":"keepalive"}'
      - name: App shell reachable
        run: curl -fsS -o /dev/null https://xelra.dreniak.com/
