name: warm-standby
on:
  push:
    tags: ["release-*"]
  workflow_dispatch:
jobs:
  publish-standby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build && node scripts/csp-hashes.mjs out
      - name: Publish the identical static bundle to the standby host
        run: npx wrangler pages deploy out --project-name xelra-standby --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
