[build]
  command = "npm run build && npm run infra:headers"
  publish = "out"
[build.environment]
  NODE_VERSION = "22"
# Releases upload the prebuilt out/ directory. No Git auto-build integration.
# Security and cache headers are generated into out/_headers for BOTH hosts.
# Explicit SPA routes are generated in _redirects; unknown routes are 404.
