name = "xelra-edge"
main = "index.mjs"
compatibility_date = "2026-11-26"
workers_dev = false
[triggers]
crons = ["17 */12 * * *", "*/5 * * * *"]
[vars]
MAIL_ENABLED = "false"
[[r2_buckets]]
binding = "DOCS"
bucket_name = "xelra-documents"
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "xelra-backups"
routes = [
  { pattern = "files.dreniak.com", custom_domain = true }
]

[vars]
MAIL_ENABLED = "false"
APP_ORIGIN = "https://xelra-eight.vercel.app"
SUPABASE_URL = "https://flxzdexhke.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_..."